# SASMS reverse proxy: Internet -> HTTPS -> Nginx -> ASP.NET Core (the `web` container).
#
# This file is mounted into the stock nginx:alpine image at /etc/nginx/conf.d/, which that
# image's own nginx.conf already `include`s from inside its http {} block — so top-level
# directives here (like the `map` below) are correctly scoped, not inside any server block.

# Standard "only set Connection: upgrade for an actual upgrade request" pattern — SASMS
# doesn't currently use WebSockets anywhere (no SignalR, no raw ws:// usage; the
# Work Hours Overview's partial-swap and the face-capture flow are both plain fetch()), but
# this keeps the proxy ready without special-casing regular requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Let the app itself answer plain-HTTP health checks (e.g. a future DigitalOcean load
    # balancer) without forcing a redirect first.
    location /health {
        proxy_pass http://web:8080/health;
    }

    # Everything else: redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # --- TLS certificate — placeholder paths, see nginx/README.md -----------------------
    # These files do not exist yet in a fresh checkout (nginx/certs/ is gitignored, like
    # every other machine/deployment-local secret in this project). Nginx will refuse to
    # start until something real is mounted here. nginx/README.md documents the exact
    # bootstrap steps: a temporary self-signed cert to get the stack running at all, then
    # swapping in a real Let's Encrypt certificate once the Droplet has a domain pointed at
    # it — the config below never needs to change for that swap, only the files on disk do.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Leave attachments are capped at 500KB server-side (LeaveService's own validation) —
    # this is just Nginx's outer ceiling, with headroom for the rest of the multipart form.
    client_max_body_size 2m;

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support, kept ready even though nothing currently needs it (see map
        # above).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
